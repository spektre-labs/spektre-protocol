name: creation-os CI

on:
  push:
    paths:
      - 'creation-os/**'
      - '.github/workflows/creation-os-ci.yml'
  pull_request:
    paths:
      - 'creation-os/**'
      - '.github/workflows/creation-os-ci.yml'

concurrency:
  group: creation-os-monorepo-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: creation-os

jobs:
  c11-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Merge gate (portable + v6..v26 self-tests)
        run: make merge-gate
